services:
  - type: web
    name: yolo-detector
    env: python
    plan: free
    # Install dependencies (use the same requirements.txt in repo)
    buildCommand: "pip install -r requirements.txt"
    # Use $PORT which Render sets automatically
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    # If you prefer to use Docker, change `env: docker` and Render will use the Dockerfile instead.
